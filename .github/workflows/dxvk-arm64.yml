# Builds arm64 DXVK (d3d9) for the Android port. Run by hand: Actions tab -> dxvk-arm64 -> Run workflow.
# Two variants run side by side:
#   plain = the repo's android/patches/dxvk-*.patch only   (must behave exactly like the DXVK in the stock APK)
#   tuned = plain + android/dxvk-passlog.py   (DXVK_PASS_LOG=<N>: logs every render pass of one frame in N)
#                 + android/dxvk-flushtune.py (DXVK_FLUSH_HINT_CHUNKS=<n>: fewer mid-frame submits on tile GPUs)
#                 + android/dxvk-extras.py    (persistent pipeline cache, ON by default; DXVK_MAX_ANISO=<n> cap)
#                 + android/dxvk-passtime.py  (with DXVK_PASS_LOG: GPU milliseconds per render pass, "passgpu" lines)
#                 + android/dxvk-passclass.py (passgpu lines also count blended / depth-writing / no-depth-test draws)
#                 + android/dxvk-blendlimit.py (DXVK_BLEND_SKIP / DXVK_BLEND_BUDGET: skip or cap blended 3D draws)
#                 + android/dxvk-lowres.py    (DXVK_LOWRES=1: draw blended 3D effects at half resolution, then composite)
#           passlog/flushtune/aniso are inert unless their variable is set in env.ini. The pipeline cache is the one
#           deliberate behaviour change: compiled shaders are kept in dxvk_pipeline.cache next to the other app data.
# No game files are involved, so a public fork is fine.
#
# Why the clone/patch steps are spelled out here: android/build-deps.sh applies patches with
#   git -C <dir> apply --check <relative path> 2>/dev/null
# which cannot find a relative path after -C and silently skips the patch -> an UNPATCHED DXVK that aborts in
# Direct3DCreate9 on Android. Here the patches are applied with absolute paths and the result is verified.
name: dxvk-arm64

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, tuned]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check that every script this build needs is in the repo
        run: |
          missing=0
          for f in android/dxvk-passlog.py android/dxvk-flushtune.py android/dxvk-extras.py android/dxvk-passtime.py android/dxvk-passclass.py android/dxvk-blendlimit.py android/dxvk-lowres.py; do
            if [ ! -f "$f" ]; then echo "::error::missing $f - add it to the fork (Add file -> Create new file) and run again"; missing=1; fi
          done
          exit $missing

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools pkg-config python3-pip
          pip3 install --user --break-system-packages meson==1.5.2

      - name: Fetch DXVK, apply the Android patches (fails loudly), verify
        run: |
          set -euo pipefail
          tag=$(grep -oP '^DXVK_TAG=\K\S+' android/build-deps.sh)
          echo "DXVK $tag"
          git clone -q --depth 1 --branch "$tag" --recurse-submodules --shallow-submodules \
              https://github.com/doitsujin/dxvk.git deps-src/dxvk
          for p in android/patches/dxvk-*.patch; do
            echo "applying $p"
            git -C deps-src/dxvk apply "$GITHUB_WORKSPACE/$p"
          done
          grep -rq 'Android port' deps-src/dxvk/src            # marker text that only the patched source has
          if [ "${{ matrix.variant }}" = tuned ]; then
            python3 android/dxvk-passlog.py deps-src/dxvk
            python3 android/dxvk-flushtune.py deps-src/dxvk
            python3 android/dxvk-extras.py deps-src/dxvk
            python3 android/dxvk-passtime.py deps-src/dxvk
            python3 android/dxvk-passclass.py deps-src/dxvk
            python3 android/dxvk-blendlimit.py deps-src/dxvk
            python3 android/dxvk-lowres.py deps-src/dxvk
          fi

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -euo pipefail
          export PATH=$HOME/.local/bin:$PATH
          echo "NDK: $ANDROID_NDK_HOME"
          # absolute script path: also makes its own patch lookup work for SDL2/FAudio
          bash "$GITHUB_WORKSPACE/android/build-deps.sh" arm64-v8a deps-src out/arm64-v8a
          lib=out/arm64-v8a/lib/libdxvk_d3d9.so
          ls -l "$lib"; sha256sum "$lib"
          grep -aq 'latency wait' "$lib"                        # present-stats text from the Android patch is inside
          if [ "${{ matrix.variant }}" = tuned ]; then
            grep -aq 'passlog f' "$lib"
            grep -aq 'DXVK_FLUSH_HINT_CHUNKS' "$lib"
            grep -aq 'pipeline cache: saved' "$lib"
            grep -aq 'DXVK_MAX_ANISO' "$lib"
            grep -aq 'passgpu f' "$lib"
            grep -aq 'nodepthtest=' "$lib"
            grep -aq 'DXVK_BLEND_BUDGET' "$lib"
            grep -aq 'DXVK_LOWRES' "$lib"
          fi
          echo "verified: patched code is in the library"

      - uses: actions/upload-artifact@v4
        with:
          name: libdxvk_d3d9-${{ matrix.variant }}
          path: out/arm64-v8a/lib/libdxvk_d3d9.so
          retention-days: 30
